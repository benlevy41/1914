name: CI

on:
    push:
    pull_request:
        branches: [main]
    workflow_dispatch:
        
permissions:
    contents: read

jobs:
    validate:
        name: Validate Godot Project
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Godot
              uses: chickensoft-games/setup-godot@v2
              with:
                  godot-version: 4.7.2

            - name: Import project resources
              run: godot --headless --editor --path . --quit

            - name: Test project startup
              run: godot --headless --path . --quit